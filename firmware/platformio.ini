; Progetto PlatformIO per il firmware ESP32-S3 di Display Hub.
;
; Impostazioni di questo env allineate al modulo ESP32-4848S040 (480x480,
; ST7701 RGB panel, GT911 touch), la BSP è in firmware/lib/esp32_4848s040_bsp/
; ed è già presente in questo progetto (adattata da OraQuadraNano di
; SurvivalHacking/Davide Gatti). Se il tuo modulo è diverso, sostituisci quella
; cartella con la BSP del tuo venditore e aggiorna le note sotto di conseguenza.
;
; ATTENZIONE VERSIONI — il progetto sorgente da cui è adattata la BSP richiede
; esplicitamente ESP32 core 2.0.17 (usa le API ledcSetup/ledcAttachPin, rimosse
; nel core 3.x). platform = espressif32 @ 6.8.1 dovrebbe corrispondere a quella
; versione di core, ma non è stato verificato in questo ambiente (nessun accesso
; di rete per una build di prova): se la build fallisce su ledcSetup/ledcAttachPin
; non definite, stai probabilmente prendendo un core troppo recente — prova a
; scendere di versione platform, oppure porta la BSP alle API ledcAttach del core 3.x.
;
; NOTA IMPORTANTE per chi sostituisce firmware/lib/esp32_4848s040_bsp/ con
; un'altra BSP: la libreria va inclusa in build/link con un #include del suo
; header in src/main.cpp (non basta una `extern void display_init();` scritta
; a mano) — è quell'#include che permette alla Library Dependency Finder di
; PlatformIO di scoprire la cartella e le sue dipendenze dichiarate in
; library.json. Senza, si ottiene un errore di linking "undefined reference"
; anche se il file .cpp della BSP esiste e compila correttamente da solo.
;
; Libreria BSP: nomi delle dipendenze in
; firmware/lib/esp32_4848s040_bsp/library.json. "lvgl" è confermato corretto.
; "GFX Library for Arduino" è pinnata alla versione ESATTA 1.6.0 (non "^1.6.0"):
; il progetto sorgente da cui è adattata la BSP specifica esplicitamente questa
; versione, e non a caso — patch successive (osservata la 1.6.8) si aspettano
; un core Arduino ESP32 più recente di quello che usiamo qui (richiedono
; esp32-hal-periman.h, introdotto dopo la 2.0.17). "TAMC_GT911" punta
; direttamente all'URL GitHub (github.com/tamctec/gt911-arduino) invece che
; a un nome nel registro PlatformIO, per il problema riscontrato inizialmente.

; Librerie locali in lib/ (nessuna dal registro): dh_settings (pagina
; Impostazioni fissa, condivisa col loader), dh_vpn + microlink + wireguard_lwip
; (VPN Tailscale, solo nelle build "Completo": nelle altre non vengono linkate,
; perché nulla le referenzia — PlatformIO le archivia come .a e il linker
; prende solo i moduli usati). Modalità scelta in include/device_config.h
; (COMM_MODE_USB / FEATURE_VPN), generato dalla web UI.

[env:esp32-s3-devkitc-1]
platform = espressif32 @ 6.8.1
board = esp32-s3-devkitc-1
framework = arduino

; PSRAM OPI e partition scheme HUGE APP: richiesti esplicitamente dal progetto
; sorgente per questo modulo (vedi commenti in cima al suo .ino principale).
board_build.partitions = huge_app.csv
board_build.arduino.memory_type = qio_opi

; Bluetooth: NimBLE-Arduino 1.4.2 vendorizzato in lib/NimBLE-Arduino (vedi il
; suo DISPLAYHUB.md). La libreria BLE del core (Bluedroid) non deve essere
; compilata insieme: i due stack non convivono.
lib_ignore = BLE
; A fine build verifica che Bluedroid non sia nel firmware (vedi lo script).
extra_scripts =
    ; pre: percorso assoluto di lv_conf.h per LVGL (vedi lo script)
    pre:tools/lv_conf_path.py
    post:tools/check_no_bluedroid.py
lib_deps =
    bblanchon/ArduinoJson @ ^7.1.0
    lvgl/lvgl @ ^8.3.11
    ; Preferences, WebServer, DNSServer, WiFi, HTTPClient sono già incluse nel
    ; core Arduino di espressif32 (arduino-esp32): nessuna dipendenza aggiuntiva.
    ; Le dipendenze specifiche del pannello (Arduino_GFX, TAMC_GT911) sono
    ; dichiarate in firmware/lib/esp32_4848s040_bsp/library.json, non qui.

build_flags =
    ; include/ (lv_conf.h, device_config.h) anche per le LIBRERIE: PlatformIO la
    ; dà da sola solo ai sorgenti in src/. Senza questa riga LVGL, dh_settings,
    ; dh_fonts e la BSP compilavano SENZA lv_conf.h (da qui il vecchio messaggio
    ; "Possible failure to include lv_conf.h" su ogni file lvgl) e usavano i
    ; valori predefiniti di LVGL, tra cui il font di base Montserrat 14 senza
    ; lettere accentate. Controllo: tools/check_ldf.py. (Il loader con schermo
    ; ha l'equivalente -I ../include.)
    -I include
    -DLV_CONF_INCLUDE_SIMPLE
    -DBOARD_HAS_PSRAM
    ; Valori ripetuti anche come define (erano il ripiego quando lv_conf.h non
    ; veniva letto): innocui, coincidono con lv_conf.h.
    -DLV_FONT_MONTSERRAT_20=1
    -DLV_FONT_MONTSERRAT_48=1
    -DLV_COLOR_DEPTH=16
    -DLV_USE_FLEX=1
    -DLV_MEM_SIZE=65536U

monitor_speed = 115200
