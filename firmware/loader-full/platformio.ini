; Loader "pesante": stesso scopo del loader leggero (firmware/loader/) — testare
; WiFi via USB prima di flashare il firmware definitivo — ma con schermo/touch
; attivi: mostra la lista delle reti trovate con dettagli (RSSI, cifratura,
; canale, intensità), permette di scegliere una rete e digitare la password
; con una tastiera a schermo, e aggiunge una schermata "Impostazioni" con MAC
; WiFi/Bluetooth e scansione/connessione dispositivi BLE.
;
; v3: home "Rete" (tab WiFi/Bluetooth), Impostazioni > Rete con interruttori
; WiFi / Bluetooth / VPN Tailscale e schermate di dettaglio. La VPN arriva da
; ../lib/dh_vpn + ../lib/microlink + ../lib/wireguard_lwip (stessa lib_extra_dirs
; della BSP): librerie locali, scoperte dalla Library Dependency Finder seguendo
; gli #include — nessuna dipendenza dal registro PlatformIO da aggiungere qui.
;
; Il protocollo seriale JSON-per-riga (hello/scan/connect) resta IDENTICO a
; quello del loader leggero: il pannello "Test connessione WiFi" della web UI
; funziona con questo firmware esattamente come con l'altro, senza modifiche —
; qui in più puoi fare tutto anche direttamente sul touchscreen.
;
; Riusa la BSP del pannello e lv_conf.h da firmware/lib/ e firmware/include/
; (stessi file del firmware definitivo) invece di duplicarli: lib_extra_dirs
; punta PlatformIO alla cartella lib/ del progetto principale, -I ../include
; fa lo stesso per lv_conf.h. Vedi i commenti in firmware/platformio.ini per
; le note complete su versioni pinnate e limitazioni della BSP.

[env:esp32-s3-devkitc-1-loader-full]
platform = espressif32 @ 6.8.1
board = esp32-s3-devkitc-1
framework = arduino

board_build.partitions = huge_app.csv
board_build.arduino.memory_type = qio_opi

lib_extra_dirs = ../lib
; Bluetooth: NimBLE-Arduino 1.4.2 vendorizzato in lib/NimBLE-Arduino (vedi il
; suo DISPLAYHUB.md). La libreria BLE del core (Bluedroid) non deve essere
; compilata insieme: i due stack non convivono.
lib_ignore = BLE
; A fine build verifica che Bluedroid non sia nel firmware (vedi lo script).
extra_scripts =
    ; pre: percorso assoluto di lv_conf.h per LVGL (vedi lo script)
    pre:../tools/lv_conf_path.py
    post:../tools/check_no_bluedroid.py
lib_deps =
    bblanchon/ArduinoJson @ ^7.1.0
    lvgl/lvgl @ ^8.3.11
    ; A differenza di firmware/platformio.ini (dove la BSP vive nella cartella
    ; lib/ NATIVA del progetto e PlatformIO risolve da solo le dipendenze
    ; dichiarate nel suo library.json), qui la BSP viene scoperta tramite
    ; lib_extra_dirs — e in quel caso PlatformIO NON installa automaticamente
    ; le dipendenze dichiarate nel library.json della libreria trovata così
    ; (verificato: la build fallisce su "Arduino_GFX_Library.h: No such file
    ; or directory" senza queste due righe). Le dichiariamo qui esplicitamente,
    ; con lo stesso pin già validato nel firmware definitivo — vedi i commenti
    ; in firmware/platformio.ini sul perché di versione esatta 1.6.0 e URL
    ; diretto invece che nome registro per TAMC_GT911.
    moononournation/GFX Library for Arduino @ 1.6.0
    https://github.com/tamctec/gt911-arduino.git
    ; BLEDevice/BLEScan/BLEClient sono nel core arduino-esp32 stesso (libreria
    ; "ESP32 BLE Arduino" bundlata): nessuna dipendenza esplicita necessaria,
    ; confermato dal grafo delle dipendenze della prima build di prova.

build_flags =
    -I ../include
    -DLV_CONF_INCLUDE_SIMPLE
    -DBOARD_HAS_PSRAM
    -DLV_FONT_MONTSERRAT_20=1
    -DLV_COLOR_DEPTH=16
    -DLV_USE_FLEX=1
    -DLV_MEM_SIZE=65536U

monitor_speed = 115200
