; Display Hub — Gateway Bluetooth (ESP32 classico, es. ESP32 DevKit / WROOM-32)
;
; L'ESP32-S3 del display ha solo Bluetooth Low Energy: le casse Bluetooth
; ricevono l'audio con A2DP, che richiede il Bluetooth CLASSIC. Questo firmware
; gira su un ESP32 "classico" e fa da ponte: si collega alla cassa (A2DP
; sorgente + AVRCP per il volume) e riceve i comandi via WiFi (API HTTP in LAN)
; o via USB (stesso protocollo JSON del loader). Vedi README.md.
;
; Qui Bluedroid (lo stack Bluetooth del core) SERVE: è l'unico con A2DP.

[env:esp-wrover-kit]
platform = espressif32 @ 6.8.1
board = esp-wrover-kit
framework = arduino
; Bluetooth Classic + WiFi non stanno nella partizione predefinita da 1,2 MB
board_build.partitions = huge_app.csv
monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    ; Niente AudioTools (non serve al gateway): senza questo la parte "ricevitore"
    ; della libreria, che non usiamo, stampa un warning a ogni build. Il codice
    ; compilato è identico (verificato confrontando i simboli).
    -DA2DP_I2S_AUDIOTOOLS=0
lib_deps =
    bblanchon/ArduinoJson @ ^7.1.0
    ; 1.8.10: l'ultima che compila con arduino-esp32 2.x (ESP-IDF 4.4);
    ; dalla 1.8.11 richiede ESP-IDF 5.
    https://github.com/pschatzmann/ESP32-A2DP.git#v1.8.10
