; Firmware "loader": build minima e veloce (nessun display/LVGL/BSP), usata
; solo per scansionare le reti WiFi e testare una connessione da USB, pilotata
; dalla web UI via Web Serial. Vedi PROTOCOL.md per il protocollo seriale.
[env:wifi-setup-loader]
platform = espressif32 @ 6.8.1
board = esp32-s3-devkitc-1
framework = arduino

; IMPORTANTE: stessa tabella di partizioni del firmware definitivo
; (firmware/platformio.ini). Anche se la partizione NVS sta convenzionalmente
; allo stesso offset (0x9000) in quasi tutti gli schemi Arduino ESP32, uno
; schema diverso tra loader e firmware definitivo può far scattare un
; reinizializzazione automatica della NVS al boot (mismatch di versione/
; dimensione rilevato da nvs_flash_init), cancellando silenziosamente le
; credenziali WiFi appena salvate dal loader. Tenerle identiche elimina
; questo rischio alla radice.
board_build.partitions = huge_app.csv

lib_deps =
    bblanchon/ArduinoJson @ ^7.1.0

monitor_speed = 115200
